name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Manage the Release PR or retry the latest release and DMG upload
        type: choice
        default: manage-pr
        options: [manage-pr, retry-publication]

permissions:
  contents: read

jobs:
  release-pr:
    name: Prepare Release PR
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'manage-pr')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: changenote-release-pr-main
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Manage Release PR
        uses: narumiruna/changenote/release@f4423760122463bf03a8d161c6f0bc4173afb6e0
        with:
          operation: manage-pr
          base-branch: main
          commit-message: 'chore(release): version Display Loom'
          pr-title: 'chore(release): version Display Loom'

  select:
    name: Select release commit
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'retry-publication')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release-commit: ${{ steps.select.outputs.release-commit }}
      releases: ${{ steps.select.outputs.releases }}
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release request
        id: request
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo 'publish=true' >>"$GITHUB_OUTPUT"
          elif [[ "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            echo 'publish=false' >>"$GITHUB_OUTPUT"
          else
            status=0
            git diff --quiet "$BEFORE" "$GITHUB_SHA" -- .changenote/releases.json || status=$?
            case "$status" in
              0) echo 'publish=false' >>"$GITHUB_OUTPUT" ;;
              1) echo 'publish=true' >>"$GITHUB_OUTPUT" ;;
              *) exit "$status" ;;
            esac
          fi

      - name: Select verified batch
        id: select
        if: steps.request.outputs.publish == 'true'
        uses: narumiruna/changenote/release@f4423760122463bf03a8d161c6f0bc4173afb6e0
        with:
          operation: select
          base-branch: main
          retry: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'retry-publication' }}

      - name: Check automatic release selection
        if: github.event_name == 'push' && steps.select.outputs.release-commit != ''
        env:
          BEFORE: ${{ github.event.before }}
          RELEASE_COMMIT: ${{ steps.select.outputs.release-commit }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" != "$BEFORE" ]]
          git merge-base --is-ancestor "$BEFORE" "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" "$GITHUB_SHA"

  package:
    name: Test and package universal DMG
    needs: select
    if: needs.select.outputs.release-commit != ''
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.release-commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install release check tools
        run: |
          brew install xcodegen
          cargo install --git https://github.com/narumiruna/changenote --rev f4423760122463bf03a8d161c6f0bc4173afb6e0 --locked

      - name: Run release script tests
        run: |
          uv run --no-project --with pyyaml python scripts/test-changenote.py
          uv run --no-project python scripts/tests/test_release.py

      - name: Run unit tests without live displays
        run: |
          xcodebuild \
            -project DisplayLoom.xcodeproj \
            -scheme DisplayLoom \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            RUN_VIRTUAL_DISPLAY_TESTS=0 \
            test

      - name: Build DMG
        env:
          RELEASES: ${{ needs.select.outputs.releases }}
        run: |
          set -euo pipefail
          version="$(jq -er '.[] | select(.package == "display-loom") | .version' <<<"$RELEASES")"
          ./scripts/package-release.sh "$version"

      - name: Retain release package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: display-loom-dmg
          path: |
            .release/*.dmg
            .release/*.dmg.sha256
            .release/*.dmg.commit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish tag, release, and DMG
    needs: [select, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: changenote-publication-main
      cancel-in-progress: false
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.release-commit }}
          fetch-depth: 0

      - name: Download release package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: display-loom-dmg
          path: .release

      - name: Verify downloaded package
        id: package
        env:
          RELEASES: ${{ needs.select.outputs.releases }}
        run: |
          set -euo pipefail
          version="$(jq -er '.[] | select(.package == "display-loom") | .version' <<<"$RELEASES")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          artifact="Display-Loom-$version.dmg"
          [[ "$(<".release/$artifact.commit")" == "$(git rev-parse HEAD)" ]]
          checksum="$(cd .release && shasum -a 256 "$artifact")"
          [[ "$(<".release/$artifact.sha256")" == "$checksum" ]]
          (cd .release && shasum -a 256 -c "$artifact.sha256")
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Publish verified tag and release notes
        uses: narumiruna/changenote/release@f4423760122463bf03a8d161c6f0bc4173afb6e0
        with:
          operation: publish
          base-branch: main
          expected-release-commit: ${{ needs.select.outputs.release-commit }}

      - name: Upload DMG and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: CONFIRM_PUBLISH="v$VERSION" ./scripts/publish-release.sh "$VERSION"
