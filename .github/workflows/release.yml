name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release without the v prefix, for example 0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    env:
      VERSION: ${{ inputs.version }}
      DEVELOPMENT_TEAM: A4YQL6FFTK
      NOTARY_PROFILE: display-loom-notary
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Validate release request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Release workflow must be dispatched from main." >&2
            exit 1
          }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must use MAJOR.MINOR.PATCH format." >&2
            exit 1
          }

          git fetch --quiet origin main --tags
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "Checked-out commit does not match origin/main." >&2
            exit 1
          }
          [[ -z "$(git status --porcelain)" ]] || {
            echo "Working tree is not clean." >&2
            exit 1
          }

          project_version="$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
          [[ "$project_version" == "$VERSION" ]] || {
            echo "project.yml version is $project_version, expected $VERSION." >&2
            exit 1
          }
          [[ -f "docs/releases/v$VERSION.md" ]] || {
            echo "Missing docs/releases/v$VERSION.md." >&2
            exit 1
          }

          tag="v$VERSION"
          ! git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null || {
            echo "Tag already exists: $tag" >&2
            exit 1
          }
          ! gh release view "$tag" >/dev/null 2>&1 || {
            echo "GitHub Release already exists: $tag" >&2
            exit 1
          }

      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project DisplayLoom.xcodeproj \
            -scheme DisplayLoom \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          set -euo pipefail

          [[ -n "$CERTIFICATE_P12" ]] || {
            echo "Missing DEVELOPER_ID_APPLICATION_P12 secret." >&2
            exit 1
          }
          [[ -n "$CERTIFICATE_PASSWORD" ]] || {
            echo "Missing DEVELOPER_ID_APPLICATION_PASSWORD secret." >&2
            exit 1
          }

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/display-loom-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode >"$certificate_path"
          chmod 600 "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -t cert \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F 'Developer ID Application:' \
            | grep -F "($DEVELOPMENT_TEAM)"

          {
            echo "RELEASE_CERTIFICATE_PATH=$certificate_path"
            echo "RELEASE_KEYCHAIN_PATH=$keychain_path"
            echo "RELEASE_KEYCHAIN_PASSWORD=$keychain_password"
            echo "NOTARY_KEYCHAIN=$keychain_path"
          } >>"$GITHUB_ENV"

      - name: Configure notarization credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail

          [[ -n "$NOTARY_APPLE_ID" ]] || {
            echo "Missing APPLE_ID secret." >&2
            exit 1
          }
          [[ -n "$NOTARY_PASSWORD" ]] || {
            echo "Missing APPLE_APP_SPECIFIC_PASSWORD secret." >&2
            exit 1
          }

          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$DEVELOPMENT_TEAM" \
            --password "$NOTARY_PASSWORD" \
            --keychain "$RELEASE_KEYCHAIN_PATH" \
            --validate

      - name: Build, sign, and notarize
        run: ./scripts/package-release.sh "$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_PUBLISH: v${{ inputs.version }}
          RELEASE_TAG_MODE: annotated
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/publish-release.sh "$VERSION"

      - name: Delete temporary credentials
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN_PATH:-}" && -f "$RELEASE_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN_PATH" || true
          fi
          rm -f "${RELEASE_CERTIFICATE_PATH:-}"
