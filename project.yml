name: DisplayLoom
options:
  bundleIdPrefix: dev.narumi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_HARDENED_RUNTIME: true
    ENABLE_APP_SANDBOX: true
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    RUN_VIRTUAL_DISPLAY_TESTS: "0"
targets:
  DisplayLoom:
    type: application
    platform: macOS
    sources:
      - path: DisplayLoom
    dependencies:
      - sdk: AppKit.framework
      - sdk: ColorSync.framework
      - sdk: CoreGraphics.framework
      - sdk: ServiceManagement.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: DisplayLoom/Resources/DisplayLoom.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: DisplayLoom/Resources/Info.plist
      properties:
        CFBundleDisplayName: Display Loom
        CFBundleName: Display Loom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 Narumi
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.narumi.DisplayLoom
        PRODUCT_NAME: Display Loom
        PRODUCT_MODULE_NAME: DisplayLoom
        SWIFT_OBJC_BRIDGING_HEADER: DisplayLoom/Bridge/DisplayLoom-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  DisplayLoomTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DisplayLoomTests
    dependencies:
      - target: DisplayLoom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.narumi.DisplayLoomTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Display Loom.app/Contents/MacOS/Display Loom
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  DisplayLoom:
    build:
      targets:
        DisplayLoom: all
        DisplayLoomTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DisplayLoomTests
      environmentVariables:
        RUN_VIRTUAL_DISPLAY_TESTS: "$(RUN_VIRTUAL_DISPLAY_TESTS)"
    archive:
      config: Release
